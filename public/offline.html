<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestion Centre - Hors ligne</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f9fafb;color:#111827;padding:1rem}
.card{background:#fff;border-radius:1rem;padding:2.5rem 2rem;text-align:center;max-width:360px;width:100%;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.circle{width:64px;height:64px;margin:0 auto 1.25rem;background:#eff6ff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px}
h1{font-size:1.15rem;font-weight:600;margin-bottom:.5rem}
p{font-size:.875rem;color:#6b7280;line-height:1.5}
.dot{width:8px;height:8px;border-radius:50%;background:#f59e0b;display:inline-block;margin-right:.35rem;vertical-align:middle}
.retry{display:inline-block;margin-top:1.25rem;padding:.6rem 1.5rem;background:#2563eb;color:#fff;border:none;border-radius:.5rem;font-size:.875rem;cursor:pointer}
.retry:active{opacity:.8}
</style>
</head>
<body>
<div class="card">
  <div class="circle"><span class="dot"></span></div>
  <h1>Mode hors ligne</h1>
  <p>Connectez-vous a Internet pour charger l'application.<br><br>Apres votre premiere connexion, vos donnees seront sauvegardees automatiquement et accessibles hors ligne.</p>
  <button class="retry" onclick="location.reload()">Reessayer</button>
</div>
</body>
</html>
